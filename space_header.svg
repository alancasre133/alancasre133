<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="100%" stop-color="#0a0d1f"/>
    </linearGradient>
    <radialGradient id="nebula" cx="24%" cy="18%" r="62%">
      <stop offset="0%" stop-color="#4631a0" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#1a2a6e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="82%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#2a6cc0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05060f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="240" rx="14"/></clipPath>
    <style>
      @keyframes tw { 0%,100%{opacity:.25} 50%{opacity:1} }
      .s  { animation: tw 3s   ease-in-out infinite }
      .s2 { animation: tw 4.5s ease-in-out infinite }
      .s3 { animation: tw 2.2s ease-in-out infinite }
      @keyframes shoot {
        0%   { opacity:0; transform: translate(120px,8px) }
        3%   { opacity:1 }
        12%  { opacity:1 }
        17%  { opacity:0; transform: translate(470px,140px) }
        100% { opacity:0; transform: translate(470px,140px) }
      }
      .shoot { animation: shoot 9s linear infinite }
      @keyframes glow { 0%,100%{opacity:.85} 50%{opacity:1} }
      .neb { animation: glow 7s ease-in-out infinite }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="240" rx="14" fill="url(#sky)"/>
  <rect class="neb" x="0" y="0" width="1200" height="240" rx="14" fill="url(#nebula)"/>
  <rect class="neb" x="0" y="0" width="1200" height="240" rx="14" fill="url(#nebula2)"/>

  <g fill="#ffffff">
    <circle class="s"  cx="60"  cy="40"  r="1.3"/><circle cx="120" cy="92" r="0.9" opacity=".5"/>
    <circle class="s2" cx="185" cy="30"  r="1.6"/><circle cx="240" cy="130" r="1" opacity=".6"/>
    <circle class="s"  cx="300" cy="58"  r="1.2"/><circle cx="355" cy="112" r="0.8" opacity=".45"/>
    <circle class="s3" cx="415" cy="40"  r="1.5"/><circle cx="470" cy="150" r="1" opacity=".55"/>
    <circle cx="540" cy="80" r="0.9" opacity=".5"/><circle class="s2" cx="600" cy="34" r="1.3"/>
    <circle cx="660" cy="120" r="1.1" opacity=".65"/><circle class="s" cx="720" cy="54" r="0.8"/>
    <circle cx="150" cy="175" r="1.2" opacity=".7"/><circle cx="260" cy="200" r="0.9" opacity=".5"/>
    <circle class="s3" cx="370" cy="172" r="1.4"/><circle cx="505" cy="200" r="1" opacity=".55"/>
    <circle cx="620" cy="185" r="0.8" opacity=".45"/><circle class="s" cx="700" cy="205" r="1.2"/>
    <circle cx="90" cy="150" r="0.9" opacity=".5"/><circle class="s2" cx="210" cy="70" r="1.1"/>
    <circle cx="330" cy="150" r="0.8" opacity=".45"/><circle class="s3" cx="560" cy="150" r="1.3"/>
    <circle cx="680" cy="78" r="1" opacity=".55"/><circle cx="770" cy="150" r="0.9" opacity=".5"/>
    <circle class="s" cx="740" cy="30" r="1.1"/><circle cx="810" cy="195" r="1" opacity=".55"/>
    <circle cx="880" cy="60" r="0.9" opacity=".5"/><circle class="s2" cx="950" cy="150" r="1.1"/>
    <circle cx="1010" cy="60" r="0.8" opacity=".45"/><circle class="s" cx="1080" cy="120" r="1.2"/>
    <circle class="s3" cx="1140" cy="50" r="1"/><circle cx="1120" cy="180" r="0.9" opacity=".5"/>
    <circle cx="1000" cy="190" r="0.8" opacity=".45"/><circle class="s2" cx="900" cy="170" r="1"/>
  </g>
  <g stroke="#cfe0ff" stroke-width="1" opacity=".85">
    <path d="M250 50 v9 M245.5 54.5 h9"/>
    <path d="M580 150 v9 M575.5 154.5 h9"/>
    <path d="M160 108 v8 M156 112 h8"/>
    <path d="M1050 70 v8 M1046 74 h8"/>
  </g>

  <!-- shooting star -->
  <g class="shoot">
    <line x1="0" y1="0" x2="36" y2="11" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="36" cy="11" r="2" fill="#ffffff"/>
  </g>

  <!-- ocean wave along the bottom -->
  <g clip-path="url(#round)">
    <path d="M0,206 C 75,190 225,222 300,206 C 375,190 525,222 600,206 C 675,190 825,222 900,206 C 975,190 1125,222 1200,206 L1200,240 L0,240 Z" fill="#ffffff"/>
    <path d="M0,216 C 75,200 225,232 300,216 C 375,200 525,232 600,216 C 675,200 825,232 900,216 C 975,200 1125,232 1200,216 L1200,240 L0,240 Z" fill="#ffffff"/>
  </g>

  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="700" letter-spacing="-0.5">Alan Axel Castro Reséndiz</text>
  <text x="600" y="140" text-anchor="middle" fill="#a9b6d6" font-size="16">Software Engineer at Amazon · building toward Physical AI &amp; Robotics</text>
</svg>
